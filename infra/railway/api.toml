# Railway service `api`. Dashboard: Settings → Config-as-code → /infra/railway/api.toml
[build]
builder = "DOCKERFILE"
watchPatterns = ["/backend/**"]

[deploy]
# Migrations run in scripts/start-api.sh on container start.
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
