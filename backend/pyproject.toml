[project]
name = "sessio-backend"
version = "0.1.0"
description = "Sessio API and workers"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "TID"]
ignore = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Rule 15: vendor SDKs only inside app/adapters/ (adapters override via per-file-ignores).
"google".msg = "Vendor SDKs belong in app/adapters/ only."
"boto3".msg = "Vendor SDKs belong in app/adapters/ only."

[tool.ruff.lint.per-file-ignores]
"app/adapters/**" = ["TID251"]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
