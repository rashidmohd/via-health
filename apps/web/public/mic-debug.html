<!doctype html>
<!-- TEMPORARY Safari mic diagnostic. Delete after debugging. Shows numbers only, records nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mic debug</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 24px; background: #FAFAF6; color: #2B2A26; }
  button { font: inherit; padding: 8px 16px; }
  pre { background: #fff; border: 1px solid #E6E6DE; padding: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Mic debug</h1>
<p>Press the button, then keep talking for about 12 seconds. Copy the text below and paste it back.</p>
<button id="go">Start (keep talking)</button>
<pre id="out"></pre>
<script>
const out = document.getElementById('out')
const log = (line) => { out.textContent += line + '\n' }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const APP = { echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1 }

async function variant(name, { earlyContext, constraints }) {
  log(`--- ${name}`)
  let context = earlyContext ? new AudioContext() : null
  let stream
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: constraints })
  } catch (e) {
    log(`getUserMedia failed: ${e.name} ${e.message}`)
    return
  }
  context ??= new AudioContext()
  const track = stream.getAudioTracks()[0]
  log(`track: readyState=${track.readyState} muted=${track.muted} enabled=${track.enabled} label="${track.label}"`)
  log(`settings: ${JSON.stringify(track.getSettings())}`)
  log(`context after create: state=${context.state} sampleRate=${context.sampleRate}`)
  const resumed = await Promise.race([context.resume().then(() => 'ok', (e) => 'rejected ' + e.name), sleep(1000).then(() => 'still pending after 1s')])
  log(`resume(): ${resumed} → state=${context.state}`)

  const source = context.createMediaStreamSource(stream)
  const analyser = context.createAnalyser()
  analyser.fftSize = 2048
  source.connect(analyser)
  let worklet = 'not tried', messages = 0, maxWorklet = 0
  try {
    await context.audioWorklet.addModule('/mic-level.js')
    const node = new AudioWorkletNode(context, 'mic-level')
    const silent = context.createGain()
    silent.gain.value = 0
    source.connect(node).connect(silent).connect(context.destination)
    node.port.onmessage = (e) => { messages++; maxWorklet = Math.max(maxWorklet, e.data) }
    worklet = 'loaded'
  } catch (e) {
    worklet = `failed: ${e.name} ${e.message}`
  }
  log(`worklet: ${worklet}`)

  const buf = new Float32Array(analyser.fftSize)
  let maxAnalyser = 0
  const t0 = performance.now()
  while (performance.now() - t0 < 3500) {
    analyser.getFloatTimeDomainData(buf)
    let sum = 0
    for (const v of buf) sum += v * v
    maxAnalyser = Math.max(maxAnalyser, Math.sqrt(sum / buf.length))
    await sleep(50)
  }
  log(`after 3.5 s: state=${context.state} currentTime=${context.currentTime.toFixed(2)} track.muted=${track.muted}`)
  log(`worklet messages=${messages} max rms=${maxWorklet.toFixed(4)} | analyser max rms=${maxAnalyser.toFixed(4)}  (voice needs > 0.02)`)
  stream.getTracks().forEach((t) => t.stop())
  await context.close()
}

document.getElementById('go').onclick = async () => {
  out.textContent = ''
  log(`userAgent: ${navigator.userAgent}`)
  log(`secure context: ${window.isSecureContext}  supported constraints: ${JSON.stringify(navigator.mediaDevices?.getSupportedConstraints?.())}`)
  // Variant A first: it is the only one that can use this click's user gesture.
  await variant('A: context created in the click, app constraints', { earlyContext: true, constraints: APP })
  await variant('B: context created after permission (current app), app constraints', { earlyContext: false, constraints: APP })
  await variant('C: context after permission, plain audio:true', { earlyContext: false, constraints: true })
  log('done')
}
</script>
</body>
</html>
